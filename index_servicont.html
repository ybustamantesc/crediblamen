<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicont - Selección de Empresa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.2em;
        }

        .companies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .company-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .company-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .company-btn:active {
            transform: translateY(-2px);
        }

        .company-btn.disabled {
            background: linear-gradient(135deg, #cbd5e0 0%, #a0aec0 100%);
            cursor: not-allowed;
            box-shadow: 0 4px 15px rgba(160, 174, 192, 0.2);
            position: relative;
            overflow: hidden;
        }

        .company-btn.disabled::after {
            content: "Próximamente";
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 0.7em;
        }

        .company-btn.disabled:hover {
            transform: none;
            box-shadow: 0 4px 15px rgba(160, 174, 192, 0.2);
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
            color: #666;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .header p {
                font-size: 1em;
            }

            .companies-grid {
                grid-template-columns: 1fr;
            }
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">S</div>
        <div class="header">
            <h1>Bienvenido a Servicont</h1>
            <p>Seleccione la empresa a la que desea ingresar</p>
        </div>

        <div class="companies-grid">
            <button class="company-btn disabled" onclick="alert('Esta empresa estará disponible próximamente')">
                BR Construcciones
            </button>

            <a href="https://servicont.ncdv.tech/alfaimpresiones/login" class="company-btn">
                Alfa Impresiones
            </a>

            <button class="company-btn disabled" onclick="alert('Esta empresa estará disponible próximamente')">
                Estilo Lilis
            </button>

            <button class="company-btn disabled" onclick="alert('Esta empresa estará disponible próximamente')">
                M2 Arquitecto
            </button>

            <button class="company-btn disabled" onclick="alert('Esta empresa estará disponible próximamente')">
                ONG Millón de Amigos
            </button>

            <button class="company-btn disabled" onclick="alert('Esta empresa estará disponible próximamente')">
                Casa de Moda
            </button>

            <button class="company-btn disabled" onclick="alert('Esta empresa estará disponible próximamente')">
                Nixin
            </button>

            <button class="company-btn disabled" onclick="alert('Esta empresa estará disponible próximamente')">
                María Meléndez
            </button>

            <button class="company-btn disabled" onclick="alert('Esta empresa estará disponible próximamente')">
                Armonía
            </button>

            <button class="company-btn disabled" onclick="alert('Esta empresa estará disponible próximamente')">
                China Xin SA
            </button>

            <button class="company-btn disabled" onclick="alert('Esta empresa estará disponible próximamente')">
                Las Brasas
            </button>

            <a href="https://servicont.ncdv.tech/lasminitas/login" class="company-btn">
                Las Minitas
            </a>
        </div>

        <div class="footer">
            <p>&copy; 2026 Servicont. Todos los derechos reservados.</p>
        </div>
    </div>
</body>
</html>
